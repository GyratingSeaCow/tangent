# GPU passthrough override — opt-in, for hosts with an NVIDIA GPU + the
# NVIDIA Container Toolkit installed. GPU-less deployments simply never use
# this file and keep the stock CPU-only compose.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# The OCR install wizard's RTX flavour needs the GPU visible inside the
# container; /v1/ocr/capability reports gpu_visible accordingly.
services:
  tangent-server:
    build:
      args:
        # CUDA torch + the cu12 runtime wheels only make sense where a GPU
        # is actually passed through, so the GPU override also switches the
        # image build to the CUDA flavour (~9 GB larger than the CPU build).
        TANGENT_GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
