services:
  tangent-server:
    build: .
    container_name: tangent-server
    ports:
      - "8000:8000"
    volumes:
      - tangent-data:/data
    environment:
      - TANGENT_DATA_DIR=/data
      - TANGENT_LOG_LEVEL=info
      - TANGENT_WHISPER_MODEL=large-v3
    restart: unless-stopped

volumes:
  tangent-data:
    name: tangent-data