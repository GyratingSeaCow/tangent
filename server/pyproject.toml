[project]
name = "tangent-server"
version = "1.7.0"
description = "Tangent v1 server: voice brain-dump storage + transcription"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "GyratingSeaCow", email = "gyratingseacow@users.noreply.github.com" }]

dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.20",
    "faster-whisper>=1.1.0,<2",
    # Imported directly by app.services.ocr_env.default_runner (snapshot_download);
    # do not rely on it arriving transitively via faster-whisper.
    "huggingface_hub>=0.25",
    # PIL is imported at MODULE level on the boot path (app.main → app.api.sync
    # → app.services.ocr_worker / app.services.ink_render), so a container built
    # from this file fails at import time on every boot without it. It is NOT
    # part of the on-demand OCR venv (that env has its own pillow); the base
    # server needs it just to import.
    "pillow>=10",
    "structlog>=24.4.0,<25",
    "python-dotenv>=1.0.1,<2",
    "sse-starlette>=2.1.3,<3",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio>=3.1,<5",
]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "httpx>=0.28.1,<1",
    "requests>=2.32.0,<3",
    "ruff>=0.7.0,<1",
    "mypy>=1.13.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM105"]  # B008/SIM105: FastAPI patterns + generator cleanup

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
# Pin the fixture loop scope explicitly. Left unset, pytest-asyncio's default
# changed between releases, and because `dev` only constrains it to <1 a fresh
# install could pick a version that shares one loop across tests — which made
# tests/test_jobs.py and tests/test_job_segments.py fail in a full run while
# passing alone ("Event is bound to a different event loop").
asyncio_default_fixture_loop_scope = "function"