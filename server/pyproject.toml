[project]
name = "tangent-server"
version = "1.0.0"
description = "Tangent v1 server: voice brain-dump storage + transcription"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "GyratingSeaCow", email = "gyratingseacow@users.noreply.github.com" }]

dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "python-multipart>=0.0.20",
    "faster-whisper>=1.1.0,<2",
    "structlog>=24.4.0,<25",
    "python-dotenv>=1.0.1,<2",
    "sse-starlette>=2.1.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<1",
    "httpx>=0.28.1,<1",
    "ruff>=0.7.0,<1",
    "mypy>=1.13.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM105"]  # B008/SIM105: FastAPI patterns + generator cleanup

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"