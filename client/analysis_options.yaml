include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    # Vendored upstream package; analyzed in its own release pipeline. Tangent's
    # one-line Android hook guard is exercised by the source-build contract test.
    - third_party/pdfium_dart/**
    - android/**
    - windows/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    require_trailing_commas: true
    avoid_print: true
    unawaited_futures: true
    cancel_subscriptions: true