name: tangent
description: "Self-hosted voice brain-dump app for ADHD brains."
publish_to: 'none'
version: 1.4.0+4

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.2
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: 3.0.6
  dio: ^5.7.0
  record: ^6.2.1
  record_linux: ^1.0.0
  just_audio: ^0.9.40
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.3
  connectivity_plus: ^6.0.5
  go_router: ^14.2.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  logger: ^2.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  workmanager: ^0.7.0
  device_info_plus: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  sqlite3: ^2.9.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
