name: tangent
description: "Self-hosted voice brain-dump app for ADHD brains."
publish_to: 'none'
version: 1.34.0+47

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.35.0
  sqlite3: ^3.6.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.0
  crypto: 3.0.7
  dio: ^5.7.0
  record: ^6.2.1
  record_linux: ^1.0.0
  just_audio: ^0.10.6
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^22.3.1
  connectivity_plus: ^6.0.5
  go_router: ^14.2.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.5.1
  intl: ^0.20.3
  logger: ^2.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  workmanager: ^0.10.10
  device_info_plus: ^11.3.0
  pdf: ^3.13.1
  share_plus: ^10.1.2
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  window_manager: ^0.5.2
  dbus: ^0.7.15
  file_selector: ^1.1.0
  package_info_plus: ^8.3.1
  flutter_markdown_plus: ^1.0.12
  tray_manager: ^0.7.0
  hotkey_manager: ^0.2.3
  url_launcher: ^6.3.0
  timezone: ^0.11.1
  flutter_timezone: ^3.0.1
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter
  just_audio_platform_interface: ^4.6.0
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon.png
    - assets/tray/tray_icon.ico
    - assets/licenses/AGPL-3.0.txt
