name: tangent
description: "Self-hosted voice and text brain dumps, notes, notebooks and to-dos."
publish_to: 'none'
version: 1.48.4+67

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.2
  sqlite3: ^3.7.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.7
  dio: ^5.7.0
  record: ^7.1.1
  record_linux: ^2.1.2
  just_audio: ^0.10.6
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.3
  connectivity_plus: ^6.0.5
  go_router: ^18.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  intl: ^0.20.3
  logger: ^2.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  workmanager: ^0.10.10
  device_info_plus: ^11.3.0
  pdf: ^3.11.1
  share_plus: ^10.1.2
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  window_manager: ^0.5.2
  dbus: ^0.7.12
  file_selector: ^1.0.3
  package_info_plus: ^8.3.1
  flutter_markdown_plus: ^1.0.3
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  url_launcher: ^6.3.0
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  freezed: ^4.0.2
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter
  just_audio_platform_interface: ^4.6.0
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon.png
    - assets/tray/tray_icon.ico
    - assets/licenses/AGPL-3.0.txt
