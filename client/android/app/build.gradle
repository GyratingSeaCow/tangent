plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: read android/key.properties when it exists (dev machines
// and CI write it; it is gitignored). Without it, release builds fall back
// to debug signing so `flutter run --release` still works for contributors.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace = "dev.tangent.tangent"

    // F-Droid: AGP embeds a Google-encrypted dependency-info signing block
    // by default; fdroid's check apk rejects any APK carrying it.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required by flutter_local_notifications under AGP 9 (java.time use).
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "dev.tangent.tangent"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // Flutter release builds shrink with R8 by default; without these
            // rules it strips the gson generic signatures that
            // flutter_local_notifications needs, and the app dies at plugin
            // init with "TypeToken must be created with a type argument"
            // (release-only — debug never shrinks). Rules documented by the
            // plugin, pinned in proguard-rules.pro.
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }
}

// F-Droid ABI split (reviewer-required scheme): per-ABI APKs carry distinct,
// ordered versionCodes — base*10 + {armeabi-v7a:1, arm64-v8a:2, x86_64:3} —
// so F-Droid clients always pick the right update. The universal APK (no ABI
// filter) keeps the plain base code from pubspec. Matches the recipe's
// VercodeOperation in fdroiddata metadata/dev.tangent.tangent.yml.
def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]
android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abi = output.filters.find { it.filterType == "ABI" }?.identifier
        def abiVersionCode = abiCodes.get(abi)
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }

    // F-Droid reproducible builds: the NDK linker embeds a .note.gnu.build-id
    // in every compiled native library that is not derived solely from the
    // input content, so two separate builds of identical source (e.g. the
    // `jni` package's libdartjni.so) differ by exactly that 20-byte note —
    // confirmed by diffing F-Droid's rebuild against our release APK: every
    // other byte matched. Strip it post-build so both sides land on an
    // identical (build-id-less) file.
    def variantName = variant.name.capitalize()
    tasks.matching { it.name == "strip${variantName}DebugSymbols" }.configureEach { stripTask ->
        stripTask.doLast {
            def objcopy = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy")
            if (!objcopy.exists()) {
                objcopy = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-objcopy.exe")
            }
            stripTask.outputs.files.each { dir ->
                if (dir.isDirectory()) {
                    fileTree(dir: dir, include: "**/*.so").each { so ->
                        def p = [objcopy.path, "--remove-section=.note.gnu.build-id", so.path].execute()
                        p.waitFor()
                    }
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
