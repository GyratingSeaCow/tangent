# SPDX-License-Identifier: AGPL-3.0-or-later
# Continuous integration: prove the documented gates on every push.
#
# Two independent jobs mirror the two components. The client job runs the
# same commands CONTRIBUTING.md tells a newcomer to run; if this goes red,
# the docs are lying to someone.
name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  client:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # The Linux desktop playback test dlopens libmpv through media_kit;
      # without it MediaKit.ensureInitialized throws and the test fails.
      - name: Linux desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  server:
    name: Server pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
