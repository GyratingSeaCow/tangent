# SPDX-License-Identifier: AGPL-3.0-or-later
# Release automation: pushing a v* tag builds the release APK, attaches it
# to a GitHub Release, and publishes the server image to GHCR.
#
# Users then have two install paths that need no toolchain at all:
#   - Android: download the APK from the Releases page and sideload it
#   - Server:  docker run ghcr.io/<owner>/tangent-server:<version>
#
# Both jobs gate on the full test suites: a release that skips the gates
# can ship a broken artifact with a green tag on it.
name: Release

on:
  push:
    tags: ["v*"]
  # Build a Linux AppImage on demand from any branch, without cutting a tag.
  # With `tag` set, a manual run BACK-FILLS that tag's release: the workflow
  # file comes from the branch you dispatch on (so a CI fix on main applies)
  # while every checkout, build and attachment targets the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to build and attach assets to (blank = branch artifact only)'
        required: false
        default: ''

env:
  # The ref to build: the pushed tag, or the tag named on a manual run, or
  # the dispatched branch.
  BUILD_REF: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
  # True whenever there is a release to attach to.
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v') }}

# Least privilege: the workflow-level token is read-only; each job raises
# ONLY the scope its attach/publish step needs. A compromised build step
# (a malicious pub/npm/pip package, a poisoned action) then cannot push
# packages from a client job or rewrite the repo from the image job.
permissions:
  contents: read

jobs:
  apk:
    name: Build + attach release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the APK to the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}

      # The Linux desktop playback test dlopens libmpv through media_kit;
      # without it MediaKit.ensureInitialized throws and `flutter test`
      # fails here even though this job only ships the Android APK.
      - name: Linux desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y libmpv-dev

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > client/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          EOF

      - name: Pub get
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze

      # A back-fill (manual run naming an existing tag) rebuilds code that
      # already passed its gates when it shipped; its checked-out test suite
      # may predate a CI-portability fix (v1.29.1-v1.31.1's busy-timeout
      # test), so the suite is skipped there and only there.
      - name: Test
        if: inputs.tag == ''
        working-directory: client
        run: flutter test

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release

      - name: Verify release signature
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs \
            client/build/app/outputs/flutter-apk/app-release.apk | head -3
          "$BT/apksigner" verify --print-certs \
            client/build/app/outputs/flutter-apk/app-release.apk \
            | grep -q "CN=Tangent" \
            || { echo "APK is not signed with the Tangent upload key"; exit 1; }

      - name: Rename APK to carry the version
        run: |
          # On a manual run without a tag BUILD_REF is the branch, which still makes
          # a usable, self-describing filename.
          cp client/build/app/outputs/flutter-apk/app-release.apk \
             "tangent-${BUILD_REF//\//-}.apk"

      - name: Create release and attach APK
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.BUILD_REF }}
          files: tangent-*.apk
          generate_release_notes: true

      # A manual run has no tag to attach to, so the APK ships as a build
      # artifact instead of failing the job on "GitHub Releases requires a tag".
      - name: Upload APK as a build artifact
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tangent-apk
          path: tangent-*.apk
          if-no-files-found: error

  appimage:
    name: Build + attach Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the AppImage to the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}

      # Flutter's Linux desktop toolchain, plus libmpv: media_kit dlopens it
      # at runtime and build-appimage.sh copies the system copy (and its
      # non-baseline dependency closure) into the AppDir.
      #
      # Runner pinning matters twice over: 22.04's libmpv-dev provides
      # libmpv.so.1, which the packaging script (and media_kit's probe)
      # will not accept — only 24.04 ships .so.2. It also sets the glibc
      # floor of the resulting AppImage, so it must not move backwards.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev desktop-file-utils \
            libsecret-1-dev libjsoncpp-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev \
            libnotify-dev
          # libnotify backs local_notifier (desktop reminders + completion
          # notices, v1.29.0+); its CMakeLists FATAL_ERRORs without the -dev
          # package. build-appimage.sh bundles libnotify.so.4 from the ldd
          # closure, so end users need nothing extra.
          # appindicator backs tray_manager and keybinder backs
          # hotkey_manager on Linux; both plugins FATAL_ERROR out of the
          # CMake configure when their -dev package is absent.
          # libsecret backs flutter_secure_storage on Linux and jsoncpp comes
          # with it; without their -dev packages CMake fails the configure
          # step with "required packages were not found", long before any
          # Dart code compiles.
          # FUSE is only needed to RUN an AppImage by mounting it. This job
          # extracts instead (both for appimagetool and for verification),
          # so a missing/renamed package here is not fatal — 24.04 renamed
          # libfuse2 to libfuse2t64.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
          ldconfig -p | grep -q 'libmpv\.so\.2' \
            || { echo "libmpv.so.2 absent — the AppImage would ship unplayable"; exit 1; }

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Pub get
        working-directory: client
        run: flutter pub get

      # The same gates the APK job runs: a release must not ship a Linux
      # binary built from code that never passed analyze and test.
      - name: Analyze
        working-directory: client
        run: flutter analyze

      # A back-fill (manual run naming an existing tag) rebuilds code that
      # already passed its gates when it shipped; its checked-out test suite
      # may predate a CI-portability fix (v1.29.1-v1.31.1's busy-timeout
      # test), so the suite is skipped there and only there.
      - name: Test
        if: inputs.tag == ''
        working-directory: client
        run: flutter test

      # media_kit_libs_linux downloads mimalloc at configure time and MD5s
      # it. A truncated fetch leaves the bad tarball in the build tree and
      # every retry re-checks the same corrupt file, so the tarball must be
      # deleted between attempts for a retry to mean anything.
      - name: Build Linux release bundle
        working-directory: client
        run: |
          for attempt in 1 2 3; do
            if flutter build linux --release; then
              echo "Linux bundle built on attempt $attempt"
              exit 0
            fi
            echo "::warning::Linux build attempt $attempt failed; clearing cached downloads"
            rm -f build/linux/x64/release/*.tar.gz
            sleep 10
          done
          echo "::error::flutter build linux failed three times"
          exit 1

      # appimagetool ships as an AppImage. GitHub runners have no FUSE for
      # it to mount itself with, so extract it and run it from the extracted
      # tree. Its AppRun resolves the real binary RELATIVE to its own
      # location, so the whole squashfs-root must be kept together — copying
      # AppRun alone to /usr/local/bin makes it look for
      # /usr/local/bin/usr/bin/appimagetool and die with exit 127.
      - name: Fetch appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          ( cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null )
          sudo mv /tmp/squashfs-root /opt/appimagetool
          printf '#!/bin/sh\nexec /opt/appimagetool/AppRun "$@"\n' \
            | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod 0755 /usr/local/bin/appimagetool
          appimagetool --version

      - name: Build the AppImage
        run: packaging/build-appimage.sh

      # A packaging bug that drops libmpv or mangles AppRun produces a file
      # that looks fine and dies on launch. Prove the payload is intact.
      - name: Verify the AppImage payload
        run: |
          IMG=packaging/out/Tangent-x86_64.AppImage
          test -x "$IMG"
          ./"$IMG" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bundle/tangent \
            || { echo "no Flutter binary inside the AppImage"; exit 1; }
          test -f squashfs-root/usr/lib/libmpv.so.2 \
            || { echo "libmpv missing — playback would fail at runtime"; exit 1; }
          test -L squashfs-root/usr/lib/libmpv.so \
            || { echo "unversioned libmpv symlink missing — dlopen probe fails"; exit 1; }
          echo "AppImage payload verified ($(du -h "$IMG" | cut -f1))"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tangent-x86_64.AppImage
          path: packaging/out/Tangent-x86_64.AppImage
          if-no-files-found: error

      # Only a tag push has a release to attach to; a manual run stops at
      # the artifact above.
      - name: Attach to the release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.BUILD_REF }}
          files: packaging/out/Tangent-x86_64.AppImage
          generate_release_notes: true

  windows-installer:
    name: Build + attach Windows installer
    # windows-latest became windows-2025-vs2026 (VS 2026 only) in June
    # 2026. Flutter 3.27.1's tool only knows the VS 2019/2022 generators,
    # so it fails with 'Visual Studio 16 2019 could not find any instance'.
    # windows-2022 is GitHub's documented image for VS 2022. Revisit when
    # Flutter is upgraded past the version that learned VS 2026.
    runs-on: windows-2022
    permissions:
      contents: write # attach the installer to the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Pub get
        working-directory: client
        run: flutter pub get

      # The same gates the other release jobs run. `flutter test` here also
      # exercises the Windows branches (TCP single-instance, wav capture)
      # that ubuntu runners can never reach.
      - name: Analyze
        working-directory: client
        run: flutter analyze

      # A back-fill (manual run naming an existing tag) rebuilds code that
      # already passed its gates when it shipped; its checked-out test suite
      # may predate a CI-portability fix (v1.29.1-v1.31.1's busy-timeout
      # test), so the suite is skipped there and only there.
      - name: Test
        if: inputs.tag == ''
        working-directory: client
        run: flutter test

      - name: Build Windows release bundle
        working-directory: client
        run: flutter build windows --release

      # Inno Setup: preinstalled on windows-2022/2025 images; choco is the
      # fallback so an image change cannot silently drop the installer.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
              choco install innosetup -y --no-progress
            }
          }

      - name: Build the installer
        shell: bash
        run: packaging/build-windows-installer.sh

      # An installer that unpacks nothing looks identical to a good one on
      # the Releases page. Prove the payload: silent-install into the
      # runner's user profile and require the exe to land.
      - name: Verify the installer payload
        shell: pwsh
        run: |
          $p = Start-Process packaging/windows/out/tangent-setup-x64.exe `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\Tangent\tangent.exe"
          if (-not (Test-Path $exe)) { throw "install produced no $exe" }
          Write-Host "installer payload verified: $exe"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tangent-setup-x64
          path: packaging/windows/out/tangent-setup-x64.exe
          if-no-files-found: error

      - name: Attach to the release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.BUILD_REF }}
          files: packaging/windows/out/tangent-setup-x64.exe
          generate_release_notes: true

  server-image:
    name: Publish server image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/tangent-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_REF }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Test before publishing
        working-directory: server
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tangent-server
          # On a tag push metadata-action reads the version from the ref; on a
          # back-fill run the ref is a branch, so the tag is passed explicitly.
          tags: |
            type=semver,pattern={{version}},value=${{ env.BUILD_REF }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
